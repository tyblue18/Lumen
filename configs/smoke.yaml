# Smoke-test config — 4 patients, 2 epochs, tiny batch
# Run: python scripts/train.py --config configs/smoke.yaml --subset data/raw/subset/
data_dir: data/raw/subset
run_dir: runs/smoke
seed: 42

# Dataset
train_val_split: 0.8
num_workers: 0        # 0 avoids Windows multiprocessing issues in smoke runs
samples_per_volume: 1 # 1 patch per volume per epoch for speed

# Patch
patch_size: [96, 96, 96]

# Training
batch_size: 1
epochs: 2
val_frequency: 1

# Architecture (must match default.yaml)
model:
  in_channels: 4
  out_channels: 3
  channels: [32, 64, 128, 256, 320]
  strides: [2, 2, 2, 2]
  num_res_units: 2

# Optimizer
optimizer:
  name: AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-5

# Scheduler — T_max must match epochs
scheduler:
  name: CosineAnnealingLR
  T_max: 2

# Loss
loss:
  name: DiceCELoss
  sigmoid: true
  squared_pred: true
  to_onehot_y: false

# AMP
amp: true

# Inference
sliding_window_roi: [96, 96, 96]
sliding_window_overlap: 0.5

# Logging
use_wandb: false
wandb_project: brats-segmentation
